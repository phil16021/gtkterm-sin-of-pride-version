[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

[profile.ci]
retries = 1

# The GUI window tests each drive a real window at full speed; run them one at a time so
# they do not starve each other (one of them measures main-loop stalls).
[test-groups]
gui-windows = { max-threads = 1 }

# Some of them drive dozens of dialogs; on a loaded machine they take minutes.
[[profile.default.overrides]]
filter = 'package(gtkterm-gui) and test(/^gui::window::tests::/)'
test-group = 'gui-windows'
slow-timeout = { period = "60s", terminate-after = 4 }

# lrzsz interop runs real sx/rx/sz/rz with their own timeouts; on a loaded machine they retry
# a lot (each retry waits seconds), so allow more time before terminating.
[[profile.default.overrides]]
filter = 'package(gtkterm-core) and binary(transfer)'
slow-timeout = { period = "60s", terminate-after = 5 }
