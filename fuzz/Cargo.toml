[package]
name = "gtkterm-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
gtkterm-protocols = { path = "../crates/gtkterm-protocols" }
gtkterm-core = { path = "../crates/gtkterm-core" }
gtkterm-mcp = { path = "../crates/gtkterm-mcp", default-features = false }
jiff = "0.2"
bytes = "1"

[[bin]]
name = "sunshine_scanner"
path = "fuzz_targets/sunshine_scanner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hex_parse"
path = "fuzz_targets/hex_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view_transform"
path = "fuzz_targets/view_transform.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_import"
path = "fuzz_targets/config_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_store"
path = "fuzz_targets/chunk_store.rs"
test = false
doc = false
bench = false

[[bin]]
name = "macro_text"
path = "fuzz_targets/macro_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decoders"
path = "fuzz_targets/decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xmodem"
path = "fuzz_targets/xmodem.rs"
test = false
doc = false
bench = false

[[bin]]
name = "script_parse"
