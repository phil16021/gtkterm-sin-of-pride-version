[package]
name = "gtkterm-charts"
description = "Chart models and cairo renderers for GTKTerm Sunshine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["render"]
# Cairo rendering (needs the cairo development files). The scale/palette math works without it.
render = ["dep:cairo-rs", "dep:pango", "dep:pangocairo"]

[dependencies]
gtkterm-protocols.workspace = true
gtkterm-core.workspace = true
cairo-rs = { workspace = true, optional = true }
pango = { workspace = true, optional = true }
pangocairo = { workspace = true, optional = true }
jiff.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[example]]
name = "render_samples"
required-features = ["render"]
