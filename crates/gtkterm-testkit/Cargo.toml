[package]
name = "gtkterm-testkit"
description = "Test helpers for GTKTerm Sunshine: loopback port, PTY pairs, fake devices, data generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
gtkterm-protocols.workspace = true
gtkterm-core = { workspace = true, features = ["testing"] }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true

[[bin]]
name = "sunshine-gen"
path = "src/bin/sunshine-gen.rs"

[[bin]]
name = "pipeline-bench"
path = "src/bin/pipeline-bench.rs"
