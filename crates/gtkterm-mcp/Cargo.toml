[package]
name = "gtkterm-mcp"
description = "Model Context Protocol server for GTKTerm Sunshine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# Chart PNG export (`sunshine_export_png`); needs cairo/pango development files.
png = ["dep:gtkterm-charts"]

[dependencies]
gtkterm-charts = { workspace = true, optional = true }
gtkterm-protocols.workspace = true
gtkterm-core.workspace = true
rmcp.workspace = true
axum.workspace = true
schemars.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
regex.workspace = true
jiff.workspace = true
tracing.workspace = true
thiserror.workspace = true
directories.workspace = true

[dev-dependencies]
gtkterm-core = { workspace = true, features = ["testing"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
tempfile.workspace = true
insta.workspace = true
