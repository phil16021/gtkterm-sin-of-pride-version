[package]
name = "gtkterm-core"
description = "Async I/O core for GTKTerm Sunshine: ports, sessions, config, logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# PTY pairs (`testing`) and loopback ports (`port::loopback`) for tests of this and other crates.
testing = []

[dependencies]
gtkterm-protocols.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
nix.workspace = true
libc.workspace = true
udev.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
jiff.workspace = true
tracing.workspace = true
thiserror.workspace = true
directories.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
gtkterm-core = { path = ".", features = ["testing"] }
