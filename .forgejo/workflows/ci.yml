# CI for the Rust rewrite. Runs on the local host-mode runner (label apps-ws).
name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    runs-on: apps-ws
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p gtkterm-gui --no-default-features --all-targets -- -D warnings
          cargo clippy -p gtkterm-charts --no-default-features --all-targets -- -D warnings
      - name: Tests
        run: |
          cargo nextest run --no-fail-fast
          cargo nextest run -p gtkterm-gui --no-default-features --no-fail-fast
          cargo nextest run -p gtkterm-charts --no-default-features --no-fail-fast
      - name: GUI crates (needs GTK dev packages on the runner)
        run: |
          if pkg-config --exists gtk4 libadwaita-1 vte-2.91-gtk4; then
            cargo clippy --workspace --all-targets -- -D warnings
            cargo nextest run -p gtkterm-mcp --features png
            GTKTERM_GUI_TESTS=1 GSK_RENDERER=cairo xvfb-run -a cargo nextest run -p gtkterm-gui -p gtkterm-charts
            cargo xtask install --prefix /usr --destdir "$PWD/target/stage"
            desktop-file-validate target/stage/usr/share/applications/*.desktop
            appstreamcli validate --no-net target/stage/usr/share/metainfo/*.xml
          else
            echo "GTK development packages not installed; skipping GUI crates"
          fi
      - name: Supply chain
        run: |
          cargo audit
          if command -v cargo-deny >/dev/null; then cargo deny check; fi

  fuzz-smoke:
    runs-on: apps-ws
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz each target for 60 s
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd fuzz
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
